<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Plataforma de Dados{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container-fluid">

        <span class="navbar-brand">
            <i class="bi bi-database-fill"></i>
            Plataforma de Dados
        </span>

        <a href="/admin/" class="btn btn-outline-light btn-sm">
            Admin
        </a>

    </div>
</nav>

<div class="container-fluid">

    <div class="row">

        <div class="col-md-2 bg-white border-end min-vh-100">

            <div class="list-group list-group-flush mt-3">

                <a href="/" class="list-group-item list-group-item-action">
                    <i class="bi bi-speedometer2"></i>
                    Dashboard
                </a>

                <a href="/upload/" class="list-group-item list-group-item-action">
                    <i class="bi bi-upload"></i>
                    Importações
                </a>

                <a href="/admin/" class="list-group-item list-group-item-action">
                    <i class="bi bi-gear"></i>
                    Administração
                </a>

            </div>

        </div>

        <div class="col-md-10 p-4">

            {% block content %}
            {% endblock %}

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

{% block scripts %}{% endblock %}

</body>
</html>
